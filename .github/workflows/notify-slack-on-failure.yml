name: Notify Slack on failure
run-name: ${{ format('Failure alert [{0}]', github.event.workflow_run.name) }}

on:
  workflow_run:
    workflows:
      - Post merge # post-merge.yml
      - Scan repository # scan-repo.yml
      - Clean up deployments # clean-up-deployments.yml
      - check-vulnerabilities.yml # check-vulnerabilities.yml
    types:
      - completed

permissions: {}

jobs:
  notify:
    name: Post alert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      (github.event.workflow_run.event == 'schedule' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    steps:
      - name: Check Slack webhook URL secret exists
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "error: SLACK_WEBHOOK_URL is not set"
            exit 1
          fi

      - name: Collect failed jobs
        id: jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          names=$(gh api --paginate "/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100&filter=latest" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name' \
            2>/dev/null | awk 'NR > 1 { printf ", " } { printf "%s", $0 }') || names=""
          echo "failed=${names:-unavailable}" >> "$GITHUB_OUTPUT"

      - name: Build Slack payload
        env:
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
          FAILED_JOBS: ${{ steps.jobs.outputs.failed }}
        run: |
          summary=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
          jq -n \
            --arg workflow "$WORKFLOW" \
            --arg conclusion "$CONCLUSION" \
            --arg trigger "$TRIGGER" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg summary "$summary" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg run_url "$RUN_URL" \
            --arg attempt "$RUN_ATTEMPT" \
            --arg repo "$REPO" \
            --arg failed "$FAILED_JOBS" \
            '{
              text: "\($workflow) \($conclusion) on \($repo) (\($branch))",
              blocks: [
                {
                  type: "header",
                  text: { type: "plain_text", text: ":x: \($workflow) \($conclusion)", emoji: true }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*Repository*\n\($repo)" },
                    { type: "mrkdwn", text: "*Branch*\n\($branch)" },
                    { type: "mrkdwn", text: "*Triggered by*\n\($trigger)" },
                    { type: "mrkdwn", text: "*Attempt*\n\($attempt)" }
                  ]
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: "*Failed jobs*\n\($failed)" }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: "*Commit*\n`\($sha)` \($summary) - \($actor)" }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      style: "danger",
                      text: { type: "plain_text", text: "View run", emoji: true },
                      url: $run_url
                    }
                  ]
                }
              ]
            }' > "$RUNNER_TEMP/slack-payload.json"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
          errors: true
