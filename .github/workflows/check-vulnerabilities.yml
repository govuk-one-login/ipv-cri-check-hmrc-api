name: check-vulnerabilities.yml
on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      buckets: ${{ steps.parse.outputs.buckets }}
      base: ${{ steps.base.outputs.ref }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2.2.1
        with:
          app-id: ${{ vars.NPM_AUDIT_APP_ID }}
          private-key: ${{ secrets.NPM_AUDIT_APP_KEY }}

      - name: Pull repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Resolve base branch
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: echo "ref=$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Run npm audit
        run: |
          npm ci --ignore-scripts
          npm audit --json > audit.json || true
          npm audit || true

      - name: Bucket vulnerabilities
        id: parse
        run: node .github/scripts/parse-audit.mjs

      - name: Archive audit report
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          retention-days: 3
          path: |
            audit.json
            audit-summary.json

      - name: Sync unfixable-vulnerabilities issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/sync-unfixable-issue.sh

  fix:
    name: PR (${{ matrix.bucket }})
    needs: audit
    if: needs.audit.outputs.buckets != '' && needs.audit.outputs.buckets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.audit.outputs.buckets) }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2.2.1
        with:
          app-id: ${{ vars.NPM_AUDIT_APP_ID }}
          private-key: ${{ secrets.NPM_AUDIT_APP_KEY }}

      # The base branch, so the PR diff is only the dependency fix.
      - name: Pull repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.audit.outputs.base }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      # Outside the workspace, so the audit JSON can never end up in the commit.
      - name: Fetch audit report
        uses: actions/download-artifact@v4
        with:
          name: npm-audit-report
          path: ${{ runner.temp }}/audit

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply fixes
        id: apply
        env:
          BUCKET: ${{ matrix.bucket }}
          AUDIT_SUMMARY: ${{ runner.temp }}/audit/audit-summary.json
        run: .github/scripts/apply-fix.sh "$BUCKET"

      - name: Raise signed PR
        if: steps.apply.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: ${{ needs.audit.outputs.base }}
          branch: ${{ steps.apply.outputs.branch }}
          commit-message: ${{ steps.apply.outputs.commit_message }}
          title: ${{ steps.apply.outputs.title }}
          body-path: ${{ steps.apply.outputs.body_path }}
          add-paths: |
            package.json
            package-lock.json
            integration-tests/package.json
            lambdas/*/package.json
